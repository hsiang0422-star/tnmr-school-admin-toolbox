<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="查詢 GitHub Claude Skills 儲存庫中的技能與用途">
<title>GitHub Skill 查詢｜南特行政工具箱</title>
<style>
:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d8eee5 0,transparent 28rem),#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei","Arial Unicode MS",sans-serif;line-height:1.65}
.shell{max-width:1100px;margin:auto;padding:24px 18px 44px}.hero,.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 36px #244b4210}.hero{padding:26px clamp(20px,5vw,44px)}.eyebrow{color:var(--green);font-size:13px;font-weight:800}.hero h1{margin:5px 0;font-size:clamp(28px,4vw,40px)}.hero p{margin:5px 0;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.actions a,.card a{display:inline-flex;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--green);font-weight:750;text-decoration:none}.actions a.primary{background:var(--green);color:white;border-color:var(--green)}
.panel{margin-top:16px;padding:20px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font:inherit}.status{font-size:13px;color:var(--muted);margin:10px 2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column}.card .tag{align-self:flex-start;background:var(--pale);color:var(--green);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:800}.card h2{font-size:16px;margin:9px 0 4px;overflow-wrap:anywhere}.card p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}.card a{margin-top:auto;align-self:flex-start;font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted);display:none}footer{text-align:center;color:#83928e;font-size:12px;margin-top:20px}.submit{margin-top:10px;padding:10px 16px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-weight:800;cursor:pointer}#result{margin-top:14px}.summary{padding:16px;border:1px solid var(--line);background:#fff;border-radius:14px}.summary h2{margin:0 0 8px}.summary p{color:var(--muted)}.topics{display:flex;gap:6px;flex-wrap:wrap}.topics span{background:var(--pale);padding:3px 9px;border-radius:20px;font-size:12px}.readme{white-space:pre-wrap;max-height:420px;overflow:auto;background:#f6f8f6;padding:14px;border-radius:10px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{padding:13px 11px 30px}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="shell"><header class="hero"><span class="eyebrow">南特行政工具箱｜GITHUB PROJECT EXPLAINER</span><h1>GitHub 開源專案查詢</h1><p>貼上公開 GitHub 專案連結，查看專案介紹、README、主要語言與功能線索；需要深入判讀時，可把網址提供給我一起分析。</p><div class="actions"><a href="./">返回行政工具箱</a><a href="skills.html">返回技能站</a></div></header><section class="panel"><form id="repoForm"><input class="search" id="repoUrl" type="url" required placeholder="貼上網址，例如 https://github.com/owner/repo" aria-label="GitHub 專案網址"><button class="submit" type="submit">查詢這個專案</button></form><div class="status" id="status" role="status">支援 GitHub 專案首頁、README 或檔案連結。</div><div id="result"></div></section><footer>資料來源：hsiang0422-star/claude-skills。顯示技能檔案中的名稱與用途說明。</footer></main>
<script>
const form=document.querySelector('#repoForm'),input=document.querySelector('#repoUrl'),status=document.querySelector('#status'),result=document.querySelector('#result');
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
form.addEventListener('submit',async e=>{e.preventDefault();result.innerHTML='';let u;try{u=new URL(input.value.trim())}catch{status.textContent='請輸入有效的 GitHub 網址。';return}if(u.hostname!=='github.com'){status.textContent='目前只支援 github.com 的公開專案網址。';return}const p=u.pathname.split('/').filter(Boolean);if(p.length<2){status.textContent='網址需包含擁有者與專案名稱。';return}const owner=p[0],repo=p[1];status.textContent='正在讀取 GitHub 專案資料…';try{const headers={Accept:'application/vnd.github+json'},base='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),rr=await fetch(base,{headers});if(!rr.ok)throw new Error(rr.status===404?'找不到公開專案，請確認網址。':'GitHub 回應 '+rr.status);const d=await rr.json();let readme='';try{const rm=await fetch(base+'/readme',{headers});if(rm.ok){const rd=await rm.json();const bin=atob(rd.content.replace(/\n/g,''));readme=decodeURIComponent(escape(bin))}}catch{}const plain=readme.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/^#{1,6}\s*/gm,'').replace(/[*_>]/g,'').trim().slice(0,4500);result.innerHTML='<article class="summary"><h2>'+esc(d.full_name)+'</h2><p>'+esc(d.description||'GitHub 專案未提供簡短介紹，請參考 README。')+'</p><p><b>主要語言：</b>'+esc(d.language||'未標示')+'　<b>星標：</b>'+d.stargazers_count+'　<b>最近更新：</b>'+esc((d.updated_at||'').slice(0,10))+'</p><div class="topics">'+(d.topics||[]).map(x=>'<span>'+esc(x)+'</span>').join('')+'</div><h3>README 內容</h3><div class="readme">'+esc(plain||'找不到 README 文字內容。')+'</div><p>這些內容是專案自述與功能線索。若要判斷程式實際做什麼，請把網址貼給我，我可以再檢視程式碼並用白話說明。</p><a href="'+esc(d.html_url)+'" target="_blank" rel="noreferrer">開啟 GitHub 專案 ↗</a></article>';status.textContent='已讀取公開專案資料。'}catch(err){status.textContent='查詢失敗：'+err.message+'。此頁只讀取公開 GitHub 專案。'}});
</script></body></html>
