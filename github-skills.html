<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="查詢 GitHub Claude Skills 儲存庫中的技能與用途">
<title>GitHub Skill 查詢｜南特行政工具箱</title>
<style>
:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d8eee5 0,transparent 28rem),#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei","Arial Unicode MS",sans-serif;line-height:1.65}
.shell{max-width:1100px;margin:auto;padding:24px 18px 44px}.hero,.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 36px #244b4210}.hero{padding:26px clamp(20px,5vw,44px)}.eyebrow{color:var(--green);font-size:13px;font-weight:800}.hero h1{margin:5px 0;font-size:clamp(28px,4vw,40px)}.hero p{margin:5px 0;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.actions a,.card a{display:inline-flex;padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--green);font-weight:750;text-decoration:none}.actions a.primary{background:var(--green);color:white;border-color:var(--green)}
.panel{margin-top:16px;padding:20px}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font:inherit}.status{font-size:13px;color:var(--muted);margin:10px 2px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column}.card .tag{align-self:flex-start;background:var(--pale);color:var(--green);border-radius:20px;padding:3px 9px;font-size:11px;font-weight:800}.card h2{font-size:16px;margin:9px 0 4px;overflow-wrap:anywhere}.card p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}.card a{margin-top:auto;align-self:flex-start;font-size:12px}.empty{text-align:center;padding:25px;color:var(--muted);display:none}footer{text-align:center;color:#83928e;font-size:12px;margin-top:20px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.shell{padding:13px 11px 30px}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="shell"><header class="hero"><span class="eyebrow">南特行政工具箱｜GITHUB SKILL FINDER</span><h1>GitHub Skill 查詢</h1><p>搜尋你的 Claude Skills 儲存庫技能名稱與用途，開啟 GitHub 查看完整說明。</p><div class="actions"><a class="primary" href="https://github.com/hsiang0422-star/claude-skills" target="_blank" rel="noreferrer">查看 GitHub 儲存庫 ↗</a><a href="./">返回行政工具箱</a><a href="skills.html">返回技能站</a></div></header><section class="panel"><input class="search" id="search" type="search" placeholder="搜尋技能名稱、描述或路徑" aria-label="搜尋技能"><div class="status" id="status" role="status">正在讀取 GitHub Skills…</div><div class="grid" id="grid"></div><div class="empty" id="empty">找不到符合的技能。</div></section><footer>資料來源：hsiang0422-star/claude-skills。顯示技能檔案中的名稱與用途說明。</footer></main>
<script>
const repo='hsiang0422-star/claude-skills', branch='main';
const search=document.querySelector('#search'),grid=document.querySelector('#grid'),status=document.querySelector('#status'),empty=document.querySelector('#empty');
let skills=[];
function render(){const q=search.value.trim().toLowerCase();const list=skills.filter(s=>(s.name+' '+s.path+' '+s.description).toLowerCase().includes(q));grid.innerHTML=list.map(s=>'<article class="card"><span class="tag">'+s.path.split('/').slice(0,-1).join(' / ')+'</span><h2>'+escapeHtml(s.name)+'</h2><p>'+escapeHtml(s.description||'尚無描述，請開啟技能說明查看。')+'</p><a href="https://github.com/'+repo+'/blob/'+branch+'/'+encodeURI(s.path)+'" target="_blank" rel="noreferrer">開啟 SKILL.md ↗</a></article>').join('');empty.style.display=list.length?'none':'block';status.textContent='找到 '+list.length+' / '+skills.length+' 個 Skill';}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const res=await fetch('https://api.github.com/repos/'+repo+'/git/trees/'+branch+'?recursive=1',{headers:{Accept:'application/vnd.github+json'}});if(!res.ok)throw new Error('GitHub 回應 '+res.status);const data=await res.json();const paths=data.tree.filter(x=>x.type==='blob'&&x.path.endsWith('/SKILL.md')).map(x=>x.path);skills=await Promise.all(paths.map(async path=>{const u='https://raw.githubusercontent.com/'+repo+'/'+branch+'/'+path;const r=await fetch(u);const md=await r.text();const name=md.match(/^name:\s*(.+)$/m)?.[1]||path.split('/').slice(-2,-1)[0];const description=md.match(/^description:\s*(.+)$/m)?.[1]||'';return {path,name,description}}));skills.sort((a,b)=>a.name.localeCompare(b.name));render()}catch(e){status.textContent='無法即時讀取 GitHub（'+e.message+'）。請直接開啟儲存庫查看。';}}
search.addEventListener('input',render);load();
</script></body></html>
