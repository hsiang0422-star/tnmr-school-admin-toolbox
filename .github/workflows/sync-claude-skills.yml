name: Sync Claude skills

on:
  repository_dispatch:
    types: [claude-skills-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-skill-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out toolbox
        uses: actions/checkout@v4

      - name: Add new Claude skills to catalog
        env:
          SOURCE_REPO: hsiang0422-star/claude-skills
          # 已由「hyperframes」一張卡代表的子技能，不另外列出
          SKIP: hyperframes-cli,hyperframes-registry,media-use,reverse-any-video,remotion-to-hyperframes,slideshow,figma,style-sampling
        run: python3 .github/scripts/sync_claude_skills.py

      - name: Commit updated catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills.html
          git diff --cached --quiet || git commit -m "Sync Claude skills catalog"
          git push
