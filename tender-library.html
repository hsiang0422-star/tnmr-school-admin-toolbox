<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>招標研習資料庫｜南特行政工具箱</title><style>
:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec;--orange:#e99a54}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d8eee5 0,transparent 28rem),#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei","Arial Unicode MS",sans-serif;line-height:1.7}.shell{max-width:1050px;margin:auto;padding:25px 16px 44px}.hero,.doc,.passage{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 36px #244b4210;border-radius:20px}.hero{padding:26px clamp(18px,4vw,42px)}.eyebrow{font-size:13px;color:var(--green);font-weight:800}.hero h1{font-size:clamp(27px,4vw,38px);margin:5px 0}.hero p{margin:0;color:var(--muted)}.back,.all-link{display:inline-flex;margin:14px 8px 0 0;padding:8px 13px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:750;background:var(--green);color:#fff}.all-link{background:#fff;color:var(--green);border:1px solid var(--line)}.notice{margin:15px 0;padding:12px 15px;border-left:4px solid var(--orange);background:#fff6e6;color:#705434;border-radius:0 12px 12px 0;font-size:13px}.toolbar{position:sticky;top:0;z-index:3;background:#f4f7f4ee;backdrop-filter:blur(8px);padding:10px 0}.toolbar input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}.filters{display:flex;gap:8px;overflow:auto;padding:10px 0}.filters button{white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:7px 12px;background:#fff;color:var(--muted);font:inherit;cursor:pointer}.filters button.active{background:var(--green);color:#fff}.count{font-size:13px;color:var(--muted);margin:5px 2px}.doc{margin:15px 0;padding:18px}.dochead{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.doc h2{font-size:19px;line-height:1.5;margin:8px 0}.tag{display:inline-block;padding:4px 9px;border-radius:30px;background:var(--pale);color:var(--green);font-size:12px;font-weight:800}.docmeta{font-size:12px;color:var(--muted);white-space:nowrap}.groups{display:grid;gap:15px;margin-top:14px}.group h3{font-size:15px;color:var(--green);margin:0 0 8px}.passages{display:grid;gap:8px}.passage{padding:12px 14px;border-radius:12px;line-height:1.8;white-space:pre-line}.passage mark{background:#ffec74;color:#242d27;border-radius:3px;padding:0 2px}.passage.hidden,.group.hidden,.doc.hidden,.empty.hidden{display:none}.source-toggle{margin-top:15px}.source-toggle summary{cursor:pointer;color:var(--green);font-size:14px;font-weight:800;display:inline-block;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;list-style:none}.source-toggle summary::-webkit-details-marker{display:none}.framebox{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff;height:70vh;min-height:400px}.framebox iframe{width:100%;height:100%;border:0}.source-link{display:inline-block;margin:9px 0;color:var(--green);font-size:13px;font-weight:750}.empty{text-align:center;color:var(--muted);padding:35px}.status{color:var(--muted);padding:30px;text-align:center}footer{font-size:12px;color:var(--muted);margin:20px 2px}@media(max-width:650px){.shell{padding:12px 10px 28px}.hero{padding:21px 17px}.doc{padding:14px}.dochead{display:block}.docmeta{margin-top:7px}.framebox{height:65vh;min-height:360px}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">南特行政工具箱｜採購研習</div><h1>招標研習資料庫</h1><p>彙整研習文件中與招標、採購、投標、決標、發包及履約管理相關的段落，並保留原始 Google 文件預覽。</p><a class="back" href="./">← 返回行政工具箱</a><a class="all-link" href="training-library.html">瀏覽全部研習文件</a></header><aside class="notice">本頁內容來自研習資料索引，供查閱及學習使用；實際採購案件仍應依現行法令、主管機關規定、招標文件及專業審查辦理。</aside><section class="toolbar"><input id="search" type="search" placeholder="搜尋招標、採購、投標、決標、評選等關鍵字" aria-label="搜尋招標研習段落"><nav class="filters" aria-label="段落主題"><button class="active" data-cat="全部">全部主題</button><button data-cat="招標與發包">招標與發包</button><button data-cat="投標與評選">投標與評選</button><button data-cat="決標與履約">決標與履約</button></nav><p id="count" class="count" aria-live="polite"></p></section><section id="documents"><p id="status" class="status">正在載入研習索引…</p></section><p id="empty" class="empty hidden">目前沒有符合條件的招標相關段落。</p><footer id="updated"></footer></main><script>
const sourceTerms=["招標","採購","投標","決標","發包","流標","廢標","採購法","評選","開標","審標","押標金","資格審查"];
const lifecycleTerms=["履約","契約","驗收","保固"];
let documents=[],activeCategory="全部",queryTerms=[];
const root=document.querySelector("#documents"),search=document.querySelector("#search"),count=document.querySelector("#count"),empty=document.querySelector("#empty"),status=document.querySelector("#status"),updated=document.querySelector("#updated");
function hasAny(text,terms){return terms.some(term=>text.includes(term))}
function categoryFor(text){if(hasAny(text,["決標","履約","契約","驗收","保固"]))return"決標與履約";if(hasAny(text,["投標","評選","開標","審標","押標金","資格"]))return"投標與評選";return"招標與發包"}
function markText(node,text,terms){if(!terms.length){node.textContent=text;return}const escaped=terms.map(w=>w.replace(/[.*+?^\${}()|[\]\\]/g,"\\$&"));const regex=new RegExp(escaped.join("|"),"gi");let last=0,match;while((match=regex.exec(text))){node.append(document.createTextNode(text.slice(last,match.index)));const mark=document.createElement("mark");mark.textContent=match[0];node.append(mark);last=match.index+match[0].length}node.append(document.createTextNode(text.slice(last)))}
function createDocument(doc){const relevant=doc.paragraphs.map((p,index)=>({p,index})).filter(({p})=>hasAny(p.text,sourceTerms)||hasAny(p.text,lifecycleTerms));if(!relevant.some(({p})=>hasAny(p.text,sourceTerms)))return null;
const article=document.createElement("article");article.className="doc";const head=document.createElement("header");head.className="dochead";const titleWrap=document.createElement("div"),tag=document.createElement("span"),title=document.createElement("h2");tag.className="tag";tag.textContent="研習 Google 文件";title.textContent=doc.title;titleWrap.append(tag,title);const meta=document.createElement("span");meta.className="docmeta";meta.textContent=relevant.length+" 則相關段落";head.append(titleWrap,meta);article.append(head);
const categoryGroups={"招標與發包":[],"投標與評選":[],"決標與履約":[]};relevant.forEach(({p,index})=>categoryGroups[categoryFor(p.text)].push({p,index}));
const groups=document.createElement("div");groups.className="groups";Object.entries(categoryGroups).forEach(([category,items])=>{if(!items.length)return;const section=document.createElement("section");section.className="group";section.dataset.category=category;const h=document.createElement("h3");h.textContent=category;section.append(h);const list=document.createElement("div");list.className="passages";items.forEach(({p,index})=>{const passage=document.createElement("article");passage.className="passage";passage.dataset.index=index;passage.dataset.text=p.text.toLocaleLowerCase();markText(passage,p.text,sourceTerms);list.append(passage)});section.append(list);groups.append(section)});article.append(groups);
const details=document.createElement("details");details.className="source-toggle";const summary=document.createElement("summary");summary.textContent="展開 Google 文件原始預覽";const framebox=document.createElement("div");framebox.className="framebox";const iframe=document.createElement("iframe");iframe.title=doc.title;iframe.loading="lazy";iframe.src=doc.preview_url;iframe.referrerPolicy="strict-origin-when-cross-origin";framebox.append(iframe);const a=document.createElement("a");a.className="source-link";a.href=doc.url;a.target="_blank";a.rel="noopener";a.textContent="開啟 Google 文件 ↗";details.append(summary,framebox,a);article.append(details);
return article}
function render(){const terms=queryTerms;let visible=0;document.querySelectorAll(".passage").forEach(p=>{const category=p.closest(".group").dataset.category;const categoryMatch=activeCategory==="全部"||category===activeCategory;const text=p.dataset.text;const queryMatch=!terms.length||terms.every(term=>text.includes(term));const show=categoryMatch&&queryMatch;p.classList.toggle("hidden",!show);if(show){visible++;markText(p,p.textContent,sourceTerms.concat(terms))}});
document.querySelectorAll(".group").forEach(group=>group.classList.toggle("hidden",!group.querySelector(".passage:not(.hidden)")));document.querySelectorAll(".doc").forEach(doc=>doc.classList.toggle("hidden",!doc.querySelector(".passage:not(.hidden)")));empty.classList.toggle("hidden",visible>0);count.textContent=terms.length||activeCategory!=="全部"?(visible+" 則相關段落"):"共 "+visible+" 則招標相關研習段落"}
search.addEventListener("input",()=>{queryTerms=search.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);render()});document.querySelectorAll(".filters button").forEach(button=>button.addEventListener("click",()=>{activeCategory=button.dataset.cat;document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b===button));render()}));
async function init(){try{const response=await fetch("./training-library-index.json",{cache:"no-store"});if(!response.ok)throw new Error("index");const data=await response.json();documents=(data.documents||[]).map(createDocument).filter(Boolean);root.replaceChildren(...documents);status.remove();render();updated.textContent="資料來源：GitHub training-library-index.json；索引更新日期："+data.updated_at+"。新增或修改文件後，請同步更新索引資料。"}catch(e){status.textContent="無法載入研習資料，請重新整理頁面。"}}
init();
</script></body></html>
