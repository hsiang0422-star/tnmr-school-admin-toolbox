<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研習資料庫｜南特行政工具箱</title><style>
:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d8eee5 0,transparent 28rem),#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei","Arial Unicode MS",sans-serif;line-height:1.65}.shell{max-width:1060px;margin:auto;padding:26px 18px 46px}.hero,.card,.result{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 36px #244b4210;border-radius:22px}.hero{padding:28px clamp(20px,5vw,48px)}.eyebrow{color:var(--green);font-weight:800;font-size:13px}.hero h1{font-size:clamp(27px,4vw,40px);margin:7px 0}.hero p{color:var(--muted);margin:0}.back,.folder{display:inline-flex;margin:15px 8px 0 0;background:var(--green);color:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:750;font-size:14px}.folder{background:#fff;color:var(--green);border:1px solid var(--line)}.tools{margin:18px 0 12px}.tools input,.docSearch{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);font:inherit}.hint{color:var(--muted);font-size:13px;margin:9px 2px}.results{display:grid;gap:9px;margin:12px 0}.result{padding:12px 14px;border-radius:13px}.result strong{display:block;color:var(--green);font-size:14px}.result p{font-size:14px;margin:5px 0 9px;white-space:pre-line}.result mark,.readerText mark{background:#ffec74;color:#242d27;border-radius:3px;padding:0 2px}.result button,.zoom button{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;font-weight:750;cursor:pointer}.result button{background:var(--green);color:#fff}.result-count{font-size:13px;color:var(--muted);margin:8px 2px}.grid{display:grid;grid-template-columns:1fr;gap:13px}.card{padding:18px;min-width:0;scroll-margin-top:18px}.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.tag{display:inline-block;background:var(--pale);color:var(--green);padding:4px 9px;border-radius:30px;font-size:12px;font-weight:800}.card h2{font-size:17px;line-height:1.5;margin:12px 0}.zoom{display:flex;align-items:center;gap:5px;flex-shrink:0}.zoom output{min-width:48px;text-align:center;font-size:12px;color:var(--muted);font-weight:700}.zoom button{padding:6px 9px}.zoom button[data-step]{font-size:18px;line-height:1}.reader,.preview{margin-top:8px}.reader summary,.preview summary{cursor:pointer;color:var(--green);font-size:14px;font-weight:800;display:inline-block;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 12px;list-style:none}.reader summary::-webkit-details-marker,.preview summary::-webkit-details-marker{display:none}.reader[open] summary,.preview[open] summary{background:var(--green);color:#fff}.doc-search-label{display:grid;gap:5px;margin:10px 0 0;font-size:13px;font-weight:750;color:var(--muted)}.docSearch{font-size:14px;padding:10px 12px}.readerText{margin-top:12px;padding:clamp(14px,3vw,28px);border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;line-height:1.9;overflow:auto;max-height:75vh;overscroll-behavior:contain}.readerText p{margin:.4em 0}.readerText p.heading{font-weight:800;color:var(--green);margin-top:1.2em}.readerText p.heading.level1{font-size:1.25em}.readerText p.heading.level2{font-size:1.12em}.readerText p.listitem{padding-left:1.3em;position:relative}.readerText p.listitem:before{content:"•";position:absolute;left:.25em;color:var(--green)}.readerText p.search-hit{background:#fffbe6;border-left:4px solid #eab948;padding:5px 10px;scroll-margin-top:8px}.framebox{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff;height:660px}.framebox iframe{display:block;width:100%;height:660px;border:0;transform-origin:top left}.openrow{margin:9px 0 0}.open{color:var(--green);font-size:13px;font-weight:750}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:24px}footer{color:var(--muted);font-size:12px;margin:20px 2px}@media(max-width:650px){.shell{padding:13px 11px 30px}.hero{padding:22px 18px}.card{padding:14px}.cardhead{display:block}.zoom{margin:6px 0 10px}.framebox{height:70vh;min-height:380px}.framebox iframe{height:70vh;min-height:380px}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">南特行政工具箱｜研習資料</div><h1>研習資料庫</h1><p>在網頁內文閱讀研習文件，搜尋結果會標示並定位命中段落；Google 文件原始預覽可另行展開。</p><a class="back" href="./">← 返回行政工具箱</a><a class="folder" href="https://drive.google.com/drive/folders/1YD5xODV-iz-YsyYQWns4lgjq4j_QxRK1" target="_blank" rel="noopener">前往 Google 資料夾</a></header><section class="tools"><input id="search" type="search" placeholder="搜尋所有研習文件內容或文件名稱" aria-label="搜尋所有研習文件內容或文件名稱"><p class="hint">上方搜尋框搜尋所有文件；每份文件也有自己的搜尋欄。於網頁內文按住 Ctrl 並滾動滑鼠滾輪可縮放文字；＋／−按鈕只縮放目前文件。</p><div id="resultCount" class="result-count" aria-live="polite"></div><div id="results" class="results"></div></section><section class="grid" id="grid"><p id="loading">正在載入研習文件…</p></section><footer id="updated"></footer></main><script>
let searchIndex=[],cards=[],terms=[],zoomById={};
const q=document.querySelector("#search"),grid=document.querySelector("#grid"),results=document.querySelector("#results"),count=document.querySelector("#resultCount"),loading=document.querySelector("#loading"),updated=document.querySelector("#updated");
function words(value){return value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean)}
function markInto(node,text,keys){if(!keys.length){node.textContent=text;return}const escaped=keys.map(w=>w.replace(/[.*+?^\${}()|[\]\\]/g,"\\$&"));const re=new RegExp(escaped.join("|"),"gi");let last=0,m;while((m=re.exec(text))){node.append(document.createTextNode(text.slice(last,m.index)));const mark=document.createElement("mark");mark.textContent=m[0];node.append(mark);last=m.index+m[0].length}node.append(document.createTextNode(text.slice(last)))}
function buildCard(doc){const card=document.createElement("article");card.className="card";card.dataset.id=doc.id;
const header=document.createElement("header");header.className="cardhead";const titleWrap=document.createElement("div"),tag=document.createElement("span"),title=document.createElement("h2");tag.className="tag";tag.textContent="Google 文件";title.textContent=doc.title;titleWrap.append(tag,title);
const zoom=document.createElement("div");zoom.className="zoom";const minus=document.createElement("button");minus.type="button";minus.dataset.step="-1";minus.setAttribute("aria-label","縮小文件");minus.textContent="−";const percent=document.createElement("output");percent.textContent="100%";const plus=document.createElement("button");plus.type="button";plus.dataset.step="1";plus.setAttribute("aria-label","放大文件");plus.textContent="＋";const reset=document.createElement("button");reset.type="button";reset.dataset.reset="";reset.textContent="重設";zoom.append(minus,percent,plus,reset);header.append(titleWrap,zoom);card.append(header);
const reader=document.createElement("details");reader.className="reader";const readerSummary=document.createElement("summary");readerSummary.textContent="網頁內文（可搜尋與標示）";const label=document.createElement("label");label.className="doc-search-label";label.append(document.createTextNode("搜尋本份文件"));const local=document.createElement("input");local.className="docSearch";local.type="search";local.placeholder="輸入關鍵字，標示本文件命中段落";local.setAttribute("aria-label","搜尋本份文件內容");label.append(local);const text=document.createElement("div");text.className="readerText";text.tabIndex=0;reader.append(readerSummary,label,text);card.append(reader);
const preview=document.createElement("details");preview.className="preview";const previewSummary=document.createElement("summary");previewSummary.textContent="Google 文件原始預覽";const framebox=document.createElement("div");framebox.className="framebox";const iframe=document.createElement("iframe");iframe.title=doc.title;iframe.loading="lazy";iframe.src=doc.preview_url;iframe.allow="autoplay";iframe.referrerPolicy="strict-origin-when-cross-origin";framebox.append(iframe);const row=document.createElement("p");row.className="openrow";const link=document.createElement("a");link.className="open";link.href=doc.url;link.target="_blank";link.rel="noopener";link.textContent="開啟 Google 文件 ↗";row.append(link);preview.append(previewSummary,framebox,row);card.append(preview);
local.addEventListener("input",()=>{const keys=words(local.value);const active=keys.length?keys:terms;makeReader(doc,card,active);reader.open=!!active.length&&doc.paragraphs.some(p=>active.every(k=>p.text.toLocaleLowerCase().includes(k)))});
card.addEventListener("wheel",e=>{if(e.ctrlKey&&e.target.closest(".readerText")){e.preventDefault();setZoom(card,zoomById[doc.id]+(e.deltaY<0?.1:-.1))}},{passive:false});
zoomById[doc.id]=1;minus.onclick=()=>setZoom(card,zoomById[doc.id]-.1);plus.onclick=()=>setZoom(card,zoomById[doc.id]+.1);reset.onclick=()=>setZoom(card,1);
return card}
function makeReader(doc,card,keys){const box=card.querySelector(".readerText");box.replaceChildren();doc.paragraphs.forEach((par,i)=>{const p=document.createElement("p");p.dataset.pindex=i;const heading=par.style&&par.style.startsWith("HEADING");if(heading){p.classList.add("heading");const n=Number((par.style.match(/\d+/)||[])[0]||3);p.classList.add("level"+n)}if(par.list)p.classList.add("listitem");const hit=keys.length&&keys.every(k=>par.text.toLocaleLowerCase().includes(k));if(hit)p.classList.add("search-hit");markInto(p,par.text,keys);box.append(p)})}
function snippet(text,keys){const low=text.toLocaleLowerCase(),pos=low.indexOf(keys[0]),start=Math.max(0,pos-90),end=Math.min(text.length,pos+keys[0].length+140);return(start?"…":"")+text.slice(start,end)+(end<text.length?"…":"")}
function renderSearch(){terms=words(q.value);results.replaceChildren();const hits=[];if(terms.length)for(const doc of searchIndex){if(terms.every(k=>doc.title.toLocaleLowerCase().includes(k)))hits.push({doc,index:-1,text:doc.title,titleOnly:true});doc.paragraphs.forEach((p,index)=>{if(terms.every(k=>p.text.toLocaleLowerCase().includes(k)))hits.push({doc,index,text:p.text})})}
count.textContent=terms.length?(hits.length?"找到 "+hits.length+" 個命中段落，顯示前 100 筆":"沒有找到符合的內容。"):"";hits.slice(0,100).forEach(hit=>{const item=document.createElement("article");item.className="result";const heading=document.createElement("strong");heading.textContent=hit.doc.title;const text=document.createElement("p");if(hit.titleOnly)text.textContent="文件名稱符合搜尋字詞";else markInto(text,snippet(hit.text,terms),terms);const button=document.createElement("button");button.type="button";button.textContent="在文件中查看標示";button.onclick=()=>{const card=cards.find(c=>c.dataset.id===hit.doc.id),reader=card.querySelector(".reader");reader.open=true;card.querySelector(".docSearch").value="";makeReader(hit.doc,card,terms);card.scrollIntoView({behavior:"smooth",block:"start"});if(hit.index>=0)setTimeout(()=>{const p=card.querySelector('[data-pindex="'+hit.index+'"]');if(p)p.scrollIntoView({behavior:"smooth",block:"center"})},250)};item.append(heading,text,button);results.append(item)});
searchIndex.forEach(doc=>{const card=cards.find(c=>c.dataset.id===doc.id),local=words(card.querySelector(".docSearch").value),keys=local.length?local:terms;makeReader(doc,card,keys);const match=keys.length&&doc.paragraphs.some(p=>keys.every(k=>p.text.toLocaleLowerCase().includes(k)));card.querySelector(".reader").open=!!match})}
function setZoom(card,value){value=Math.max(.7,Math.min(1.6,Math.round(value*10)/10));const id=card.dataset.id;zoomById[id]=value;card.querySelector("output").textContent=Math.round(value*100)+"%";card.querySelector(".readerText").style.fontSize=(16*value)+"px";const frame=card.querySelector("iframe"),box=card.querySelector(".framebox"),base=window.matchMedia("(max-width:650px)").matches?window.innerHeight*.7:660;frame.style.height=base+"px";frame.style.width=(100/value)+"%";frame.style.transform="scale("+value+")";box.style.height=(base*value)+"px"}
async function init(){try{const response=await fetch("./training-library-index.json",{cache:"no-store"});if(!response.ok)throw new Error("index load failed");const data=await response.json();searchIndex=data.documents||[];cards=searchIndex.map(buildCard);grid.replaceChildren(...cards);q.addEventListener("input",renderSearch);q.addEventListener("input",()=>{if(!q.value.trim())cards.forEach(c=>c.querySelector(".reader").open=false)});renderSearch();updated.textContent="資料索引更新日期："+data.updated_at+"；新增或修改文件內容時，請一併更新 GitHub 中的 training-library-index.json。"}catch(e){loading.textContent="研習資料載入失敗，請稍後重新整理頁面。"}}
init();
</script></body></html>
