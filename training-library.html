<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研習資料庫｜南特行政工具箱</title><style>
:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec;--orange:#e99a54}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#d8eee5 0,transparent 28rem),#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei","Arial Unicode MS",sans-serif;line-height:1.65}.shell{max-width:1060px;margin:auto;padding:24px 16px 44px}.hero,.card,.result,.tender-panel{background:var(--paper);border:1px solid var(--line);box-shadow:0 12px 36px #244b4210;border-radius:20px}.hero{padding:26px clamp(18px,4vw,42px)}.eyebrow{font-size:13px;color:var(--green);font-weight:800}.hero h1{font-size:clamp(27px,4vw,38px);margin:5px 0}.hero p{color:var(--muted);margin:0}.button{display:inline-flex;margin:14px 8px 0 0;padding:8px 13px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:750;background:var(--green);color:#fff}.button.alt{background:#fff;color:var(--green);border:1px solid var(--line)}.toolbar{position:sticky;top:0;z-index:4;background:#f4f7f4ee;backdrop-filter:blur(8px);padding:12px 0 8px}.toolbar input,.tender-search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}.hint{font-size:13px;color:var(--muted);margin:8px 2px}.filters{display:flex;gap:7px;overflow:auto;padding:8px 0}.filters button{white-space:nowrap;border:1px solid var(--line);border-radius:30px;padding:7px 11px;background:#fff;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.filters button.active{background:var(--green);color:#fff}.result-count{font-size:13px;color:var(--muted);margin:6px 2px}.results{display:grid;gap:8px;margin:10px 0}.result{padding:11px 13px;border-radius:12px}.result strong{display:block;color:var(--green);font-size:14px}.result p{font-size:14px;margin:5px 0 8px}.result mark,.readerText mark,.tender-text mark{background:#ffec74;color:#242d27;border-radius:3px;padding:0 2px}.result button,.zoom button,.jump{border:1px solid var(--line);background:#fff;color:var(--green);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;font-weight:750;cursor:pointer}.result button,.jump{background:var(--green);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:15px;min-width:0;scroll-margin-top:16px}.cardhead{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}.title-wrap{min-width:0}.type-tag,.cat-tag{display:inline-block;margin:0 4px 4px 0;padding:3px 8px;border-radius:30px;background:var(--pale);color:var(--green);font-size:11px;font-weight:800}.card h2{font-size:16px;line-height:1.5;margin:7px 0}.zoom{display:flex;align-items:center;gap:4px;flex-shrink:0}.zoom output{min-width:45px;text-align:center;font-size:11px;color:var(--muted)}.zoom button{padding:5px 8px}.zoom button[data-step]{font-size:17px;line-height:1}.reader,.preview{margin-top:8px}.reader summary,.preview summary{cursor:pointer;color:var(--green);font-size:13px;font-weight:800;display:inline-block;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 10px;list-style:none}.reader summary::-webkit-details-marker,.preview summary::-webkit-details-marker{display:none}.reader[open] summary,.preview[open] summary{background:var(--green);color:#fff}.doc-search-label{display:grid;gap:5px;margin:8px 0;font-size:12px;font-weight:700;color:var(--muted)}.docSearch{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit}.readerText{margin-top:10px;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;line-height:1.9;overflow:auto;max-height:68vh;overscroll-behavior:contain}.readerText p{margin:.4em 0}.readerText p.heading{font-weight:800;color:var(--green);margin-top:1em}.readerText p.heading.level1{font-size:1.2em}.readerText p.heading.level2{font-size:1.1em}.readerText p.listitem{padding-left:1.3em;position:relative}.readerText p.listitem:before{content:"•";position:absolute;left:.25em;color:var(--green)}.readerText p.search-hit{background:#fffbe6;border-left:4px solid #eab948;padding:4px 9px;scroll-margin-top:8px}.framebox{margin-top:9px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;height:62vh;min-height:320px}.framebox iframe{width:100%;height:100%;border:0}.empty{display:none;text-align:center;color:var(--muted);padding:26px}.empty.visible{display:block}.tender-panel{margin:20px 0;padding:17px;scroll-margin-top:12px}.tender-panel>summary{cursor:pointer;list-style:none;font-size:20px;font-weight:800;color:var(--green);display:flex;justify-content:space-between;gap:12px}.tender-panel>summary::-webkit-details-marker{display:none}.tender-panel[open]>summary{margin-bottom:8px}.tender-intro{color:var(--muted);font-size:13px;margin:5px 0 12px}.tender-doc{border-top:1px solid var(--line);padding:12px 0}.tender-doc h3{font-size:15px;margin:0 0 7px}.tender-text{padding:10px 12px;border-radius:10px;background:#f5f8f5;margin:7px 0;font-size:13px;white-space:pre-line}.jump{font-size:12px;padding:6px 9px}footer{font-size:12px;color:var(--muted);margin:18px 2px}.hidden{display:none!important}@media(max-width:680px){.shell{padding:12px 10px 28px}.hero{padding:21px 17px}.grid{grid-template-columns:1fr}.cardhead{display:block}.zoom{margin:5px 0 9px}.tender-panel{padding:13px}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">南特行政工具箱｜研習資料</div><h1>研習資料庫</h1><p>依主題分類研習文件，支援全文搜尋、命中段落標示與文件縮放。可在下方招標區輸入關鍵字，查找相關研習段落。</p><a class="button" href="./">← 返回行政工具箱</a><a class="button alt" href="https://drive.google.com/drive/folders/1YD5xODV-iz-YsyYQWns4lgjq4j_QxRK1" target="_blank" rel="noopener">研習講義資料夾</a><a class="button alt" href="occupational-safety-library.html">職安衛研習資料庫</a><a class="button alt" href="#tender-library">招標研習資料庫</a></header><section class="toolbar"><input id="search" type="search" placeholder="搜尋所有研習文件內容或名稱" aria-label="搜尋所有研習文件內容或名稱"><p class="hint">使用分類按鈕整理文件。文件內文區按住 Ctrl 並滾動滑鼠滾輪可縮放；＋／−按鈕只縮放目前文件。</p><nav class="filters" id="categoryFilters" aria-label="研習資料分類"></nav><div id="resultCount" class="result-count" aria-live="polite"></div><div id="results" class="results"></div></section><section class="grid" id="grid"><p id="loading">正在載入研習文件…</p></section><p id="empty" class="empty">沒有符合的研習文件。</p><details class="tender-panel" id="tender-library"><summary>招標研習資料庫 <span id="tenderCount"></span></summary><p class="tender-intro">輸入關鍵字搜尋招標、採購、投標、評選、決標、發包或履約相關研習資料；點選命中段落可回到來源文件位置。</p><input id="tenderSearch" class="tender-search" type="search" placeholder="輸入關鍵字搜尋招標研習資料"><p id="tenderPrompt" class="tender-intro">輸入關鍵字後，這裡會顯示招標研習資料與命中段落。</p><div id="tenderContent"></div></details><footer id="updated"></footer></main><script>
let searchIndex=[],cards=[],terms=[],zoomById={},activeCategory="全部",matchedDocIds=new Set();
const q=document.querySelector("#search"),grid=document.querySelector("#grid"),results=document.querySelector("#results"),count=document.querySelector("#resultCount"),loading=document.querySelector("#loading"),updated=document.querySelector("#updated"),empty=document.querySelector("#empty"),filters=document.querySelector("#categoryFilters"),tenderSearch=document.querySelector("#tenderSearch"),tenderContent=document.querySelector("#tenderContent"),tenderCount=document.querySelector("#tenderCount");
function words(value){return value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean)}
function markInto(node,text,keys){if(!keys.length){node.textContent=text;return}const low=text.toLocaleLowerCase(),sorted=[...new Set(keys)].sort((a,b)=>b.length-a.length);let pos=0;while(pos<text.length){let best=-1,term="";for(const key of sorted){const at=low.indexOf(key.toLocaleLowerCase(),pos);if(at>=0&&(best<0||at<best)){best=at;term=text.slice(at,at+key.length)}}if(best<0){node.append(document.createTextNode(text.slice(pos)));break}node.append(document.createTextNode(text.slice(pos,best)));const mark=document.createElement("mark");mark.textContent=term;node.append(mark);pos=best+term.length}}
function makeReader(doc,card,keys){const box=card.querySelector(".readerText");box.replaceChildren();doc.paragraphs.forEach((par,i)=>{const p=document.createElement("p");p.dataset.pindex=i;const heading=par.style&&par.style.startsWith("HEADING");if(heading){p.classList.add("heading");const n=Number((par.style.match(/\d+/)||[])[0]||3);p.classList.add("level"+n)}if(par.list)p.classList.add("listitem");const hit=keys.length&&keys.every(k=>par.text.toLocaleLowerCase().includes(k));if(hit)p.classList.add("search-hit");markInto(p,par.text,keys);box.append(p)})}
function setZoom(card,value){value=Math.max(.7,Math.min(1.6,Math.round(value*10)/10));const id=card.dataset.id;zoomById[id]=value;card.querySelector("output").textContent=Math.round(value*100)+"%";card.querySelector(".readerText").style.fontSize=(16*value)+"px";const frame=card.querySelector("iframe"),box=card.querySelector(".framebox"),base=window.matchMedia("(max-width:680px)").matches?window.innerHeight*.65:620;frame.style.height=base+"px";frame.style.width=(100/value)+"%";frame.style.transform="scale("+value+")";box.style.height=(base*value)+"px"}
function buildCard(doc){const card=document.createElement("article");card.className="card";card.dataset.id=doc.id;card.id="doc-"+doc.id;card.dataset.categories=(doc.categories||[]).join("|").toLocaleLowerCase();
const header=document.createElement("header");header.className="cardhead";const titleWrap=document.createElement("div"),type=document.createElement("span"),title=document.createElement("h2");type.className="type-tag";type.textContent="Google 文件";title.textContent=doc.title;titleWrap.append(type,title);(doc.categories||[]).forEach(c=>{const tag=document.createElement("span");tag.className="cat-tag";tag.textContent=c;titleWrap.append(tag)});
const zoom=document.createElement("div");zoom.className="zoom";const minus=document.createElement("button");minus.type="button";minus.dataset.step="-1";minus.textContent="−";const pct=document.createElement("output");pct.textContent="100%";const plus=document.createElement("button");plus.type="button";plus.dataset.step="1";plus.textContent="＋";const reset=document.createElement("button");reset.type="button";reset.dataset.reset="";reset.textContent="重設";zoom.append(minus,pct,plus,reset);header.append(titleWrap,zoom);card.append(header);
const reader=document.createElement("details");reader.className="reader";const rs=document.createElement("summary");rs.textContent="網頁內文（可搜尋與標示）";const label=document.createElement("label");label.className="doc-search-label";label.append(document.createTextNode("搜尋本份文件"));const input=document.createElement("input");input.className="docSearch";input.type="search";input.placeholder="輸入關鍵字，標示命中段落";label.append(input);const text=document.createElement("div");text.className="readerText";reader.append(rs,label,text);card.append(reader);
const preview=document.createElement("details");preview.className="preview";const ps=document.createElement("summary");ps.textContent="Google 文件原始預覽";const box=document.createElement("div");box.className="framebox";const iframe=document.createElement("iframe");iframe.title=doc.title;iframe.loading="lazy";iframe.src=doc.preview_url;iframe.referrerPolicy="strict-origin-when-cross-origin";box.append(iframe);preview.append(ps,box);card.append(preview);
localSearch();setupZoom();return card;
function localSearch(){input.addEventListener("input",()=>{const local=words(input.value),keys=local.length?local:terms;makeReader(doc,card,keys);reader.open=keys.length>0&&doc.paragraphs.some(p=>keys.every(k=>p.text.toLocaleLowerCase().includes(k)))})}
function setupZoom(){zoomById[doc.id]=1;minus.onclick=()=>setZoom(card,zoomById[doc.id]-.1);plus.onclick=()=>setZoom(card,zoomById[doc.id]+.1);reset.onclick=()=>setZoom(card,1);card.addEventListener("wheel",e=>{if(e.ctrlKey&&e.target.closest(".readerText")){e.preventDefault();setZoom(card,zoomById[doc.id]+(e.deltaY<0?.1:-.1))}},{passive:false})}}
function hasAny(text,list){return list.some(x=>text.includes(x))}
const tenderCore=["招標","採購","投標","決標","發包","流標","廢標","採購法","評選","開標","審標","押標金","資格審查","招標文件"];
const tenderLifecycle=["履約","契約","驗收","保固"];
function buildTender(){
 const keys=words(tenderSearch.value);
 tenderContent.replaceChildren();
 if(!keys.length){
  tenderCount.textContent="";
  const prompt=document.querySelector("#tenderPrompt");
  if(prompt){prompt.textContent="輸入關鍵字後，這裡才會顯示命中的招標研習段落。";prompt.hidden=false}
  return
 }
 const out=[];
 for(const doc of searchIndex){
  const paragraphs=doc.paragraphs.map((p,i)=>({p,i})).filter(x=>keys.every(k=>x.p.text.toLocaleLowerCase().includes(k)));
  if(paragraphs.length)out.push({doc,paragraphs})
 }
 let n=0;
 out.forEach(({doc,paragraphs})=>{
  const section=document.createElement("section");section.className="tender-doc";
  const h=document.createElement("h3");h.textContent=doc.title;section.append(h);
  paragraphs.forEach(({p,i})=>{
   const item=document.createElement("article");item.className="tender-text";item.dataset.q=p.text.toLocaleLowerCase();item.dataset.doc=doc.id;item.dataset.index=i;
   const text=document.createElement("div");text.className="tender-paragraph";markInto(text,p.text,keys);
   const btn=document.createElement("button");btn.className="jump";btn.type="button";btn.textContent="在研習文件中查看";
   btn.onclick=()=>{const card=cards.find(x=>x.dataset.id===doc.id);card.querySelector(".reader").open=true;makeReader(doc,card,keys);card.scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>{const target=card.querySelector('[data-pindex="'+i+'"]');if(target)target.scrollIntoView({behavior:"smooth",block:"center"})},200)};
   item.append(text,btn);section.append(item);n++
  });
  tenderContent.append(section)
 });
 tenderCount.textContent="（"+n+" 段命中）";
 const prompt=document.querySelector("#tenderPrompt");
 if(prompt){prompt.textContent=n?"搜尋結果如下：":"沒有找到符合的招標研習段落。";prompt.hidden=!!n}
}
function renderSearch(){terms=words(q.value);matchedDocIds=new Set();results.replaceChildren();const hits=[];if(terms.length)for(const doc of searchIndex){if(terms.every(k=>doc.title.toLocaleLowerCase().includes(k))){hits.push({doc,index:-1,text:doc.title,titleOnly:true});matchedDocIds.add(doc.id)}doc.paragraphs.forEach((p,index)=>{if(terms.every(k=>p.text.toLocaleLowerCase().includes(k))){hits.push({doc,index,text:p.text});matchedDocIds.add(doc.id)}})}
count.textContent=terms.length?(hits.length?"找到 "+hits.length+" 個命中段落，顯示前 100 筆":"沒有找到符合的內容。"):"";hits.slice(0,100).forEach(hit=>{const item=document.createElement("article");item.className="result";const heading=document.createElement("strong");heading.textContent=hit.doc.title;const text=document.createElement("p");if(hit.titleOnly)text.textContent="文件名稱符合搜尋字詞";else markInto(text,snippet(hit.text,terms),terms);const button=document.createElement("button");button.type="button";button.textContent="在文件中查看標示";button.onclick=()=>{activeCategory="全部";filterCategoryButtons();const card=cards.find(c=>c.dataset.id===hit.doc.id),reader=card.querySelector(".reader");reader.open=true;card.querySelector(".docSearch").value="";makeReader(hit.doc,card,terms);card.scrollIntoView({behavior:"smooth",block:"start"});if(hit.index>=0)setTimeout(()=>{const p=card.querySelector('[data-pindex="'+hit.index+'"]');if(p)p.scrollIntoView({behavior:"smooth",block:"center"})},250)};item.append(heading,text,button);results.append(item)});
searchIndex.forEach(doc=>{const card=cards.find(c=>c.dataset.id===doc.id),local=words(card.querySelector(".docSearch").value),keys=local.length?local:terms;makeReader(doc,card,keys);const matched=keys.length&&doc.paragraphs.some(p=>keys.every(t=>p.text.toLocaleLowerCase().includes(t)));card.querySelector(".reader").open=!!matched});applyCategoryFilter()}
function snippet(text,keys){const pos=text.toLocaleLowerCase().indexOf(keys[0]),start=Math.max(0,pos-80),end=Math.min(text.length,pos+keys[0].length+120);return(start?"…":"")+text.slice(start,end)+(end<text.length?"…":"")}
function applyCategoryFilter(){let visible=0;cards.forEach(c=>{const cats=(c.dataset.categories||"").toLocaleLowerCase().split("|");const categoryMatch=activeCategory==="全部"||cats.includes(activeCategory.toLocaleLowerCase());const searchMatch=!terms.length||matchedDocIds.has(c.dataset.id);const show=categoryMatch&&searchMatch;c.classList.toggle("hidden",!show);if(show)visible++});empty.classList.toggle("visible",cards.length>0&&visible===0)}
function filterCategoryButtons(){document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b.dataset.cat===activeCategory));applyCategoryFilter()}
function populateCategories(){const cats=[...new Set(searchIndex.flatMap(d=>d.categories||[]))].sort();const all=["全部",...cats];filters.replaceChildren();all.forEach(cat=>{const b=document.createElement("button");b.type="button";b.dataset.cat=cat;b.textContent=cat;b.className=cat==="全部"?"active":"";b.onclick=()=>{activeCategory=cat;filterCategoryButtons()};filters.append(b)})}
async function init(){try{const r=await fetch("./training-library-index.json",{cache:"no-store"});if(!r.ok)throw Error("index");const data=await r.json();searchIndex=data.documents||[];cards=searchIndex.map(buildCard);grid.replaceChildren(...cards);populateCategories();q.addEventListener("input",renderSearch);tenderSearch.addEventListener("input",buildTender);renderSearch();updated.textContent="索引更新日期："+data.updated_at+"；目前收錄 "+searchIndex.length+" 份研習文件。"}catch(e){loading.textContent="研習資料載入失敗，請重新整理頁面。"}}
init();
</script></body></html>
