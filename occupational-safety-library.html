<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>職安衛資料庫｜南特行政工具箱</title>
<style>
:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec}
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif;line-height:1.7}
.shell{max-width:940px;margin:auto;padding:22px 15px 42px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 10px 30px #244b4210}
.eyebrow{color:var(--green);font-size:13px;font-weight:800}.panel h1{margin:5px 0 8px;font-size:clamp(27px,4vw,36px)}.intro{color:var(--muted);margin:0 0 18px}
#search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font:inherit}.stats{font-size:13px;color:var(--muted);margin:10px 2px}
.group{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.group summary{padding:12px 15px;background:#edf6f1;color:var(--green);font-weight:800;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
.card{padding:13px;border:1px solid var(--line);border-radius:11px;min-width:0}.card h2{font-size:15px;line-height:1.55;margin:0 0 7px;overflow-wrap:anywhere}.type{font-size:12px;color:var(--muted)}.open{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--green);color:white;text-decoration:none;font-size:13px;font-weight:750}
.note{margin-top:18px;padding:12px 14px;background:#fff4df;border-radius:10px;font-size:13px;color:#705434}.back{display:inline-block;margin-top:18px;padding:9px 13px;background:var(--green);color:#fff;border-radius:9px;text-decoration:none;font-weight:750}
.empty{display:none;padding:24px;text-align:center;color:var(--muted)}@media(max-width:620px){.cards{grid-template-columns:1fr}.shell{padding:12px}}
</style></head>
<body><main class="shell"><section class="panel">
<div class="eyebrow">南特行政工具箱｜安全衛生</div><h1>職安衛資料庫</h1>
<p class="intro">依主題整理雲端硬碟中的職業安全衛生相關資料，可搜尋檔名並直接開啟原始檔案。</p>
<input id="search" type="search" placeholder="搜尋檔名或分類" aria-label="搜尋職安衛資料">
<div class="stats" id="stats" aria-live="polite">正在載入資料…</div><div id="groups"></div><div class="empty" id="empty">找不到符合的資料。</div>
<aside class="note">本頁公開顯示檔名、檔案類型、分類及連結。原始 Google Drive 權限未變更；若檔案僅限本人或特定帳戶，開啟時仍須登入有權限的帳戶。</aside>
<a class="back" href="./">← 返回行政工具箱</a>
</section></main>
<script>
const DATA_URL="./occupational-safety-index.json";
const groups=document.getElementById("groups"),search=document.getElementById("search"),stats=document.getElementById("stats"),empty=document.getElementById("empty");
let files=[];
function render(){
 const q=search.value.trim().toLocaleLowerCase();
 const selected=files.filter(f=>[f.title,f.category,f.type].join(" ").toLocaleLowerCase().includes(q));
 const buckets=new Map();
 for(const f of selected){const c=f.category||"其他職安衛資料";if(!buckets.has(c))buckets.set(c,[]);buckets.get(c).push(f)}
 groups.replaceChildren();
 for(const [category,items] of buckets){
  const details=document.createElement("details");details.className="group";details.open=!!q;
  const summary=document.createElement("summary");summary.textContent=category+"（"+items.length+"）";details.append(summary);
  const cards=document.createElement("div");cards.className="cards";
  for(const f of items){
   const card=document.createElement("article");card.className="card";
   const title=document.createElement("h2");title.textContent=f.title;
   const type=document.createElement("div");type.className="type";type.textContent=f.type||"雲端檔案";
   const link=document.createElement("a");link.className="open";link.href=f.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent="開啟原始檔案";
   card.append(title,type,link);cards.append(card)
  }
  details.append(cards);groups.append(details)
 }
 stats.textContent="共 "+selected.length+" 筆資料（共 "+files.length+" 筆）";
 empty.style.display=selected.length?"none":"block"
}
search.addEventListener("input",render);
fetch(DATA_URL+"?v=20261118-3",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("資料載入失敗");return r.json()}).then(d=>{files=Array.isArray(d.files)?d.files:[];render()}).catch(()=>{stats.textContent="資料載入失敗，請稍後重新整理。";empty.style.display="block"})
</script></body></html>
