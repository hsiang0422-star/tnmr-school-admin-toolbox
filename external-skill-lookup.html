<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外部 GitHub Skill 查詢｜南特行政工具箱</title>
<style>:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif;line-height:1.65}.shell{max-width:900px;margin:auto;padding:24px 16px}.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 36px #244b4210}.eyebrow{color:var(--green);font-weight:800;font-size:13px}.links{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.links a,.go{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:white;color:var(--green);font-weight:750;text-decoration:none}.form{display:flex;gap:9px;flex-wrap:wrap}.form input{flex:1;min-width:240px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.go{background:var(--green);color:white;cursor:pointer;font:inherit}.status{margin:12px 0;color:var(--muted);font-size:14px}.result{margin-top:18px;padding:18px;background:white;border:1px solid var(--line);border-radius:14px}.result h2{margin-top:0}.result p{white-space:pre-wrap}.tag{display:inline-block;background:var(--pale);padding:3px 9px;border-radius:20px;margin:2px;font-size:12px}.readme{max-height:420px;overflow:auto;white-space:pre-wrap;background:#f6f8f6;padding:14px;border-radius:10px;font-size:13px}footer{text-align:center;color:var(--muted);font-size:12px;margin:18px}</style>
</head><body><main class="shell"><section class="box"><span class="eyebrow">南特行政工具箱｜外部技能探索</span><h1>查詢網路上找到的 GitHub Skill</h1><p>貼上外部 GitHub 專案、資料夾或 SKILL.md 連結。頁面會搜尋專案中的 SKILL.md，整理技能名稱、用途說明與原始文件，協助判斷這個 Skill 是做什麼的。</p><nav class="links"><a href="./">返回行政工具箱</a><a href="github-skills.html">搜尋我的 Skill 庫</a></nav><form class="form" id="form"><input id="url" type="url" required placeholder="https://github.com/owner/repo/tree/main/path-to-skill"><button class="go" type="button" id="searchSkill">查詢外部 Skill</button></form><div class="status" id="status" role="status">支援公開 GitHub 專案或 SKILL.md 連結。</div><div id="results"></div></section><footer>只讀取公開 GitHub 內容；頁面不會安裝或執行 Skill。</footer></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('url'),status=document.getElementById('status'),out=document.getElementById('results'),button=document.getElementById('searchSkill');
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function front(md,key){const m=md.match(new RegExp('^'+key+':\\s*(.+)$','m'));return m?m[1].replace(/^["']|["']$/g,''):''}
async function search(){
out.innerHTML='';let u;try{u=new URL(input.value.trim())}catch{status.textContent='請輸入有效網址。';return}
if(u.hostname!=='github.com'){status.textContent='目前只支援 github.com 公開儲存庫。';return}
const p=u.pathname.split('/').filter(Boolean);if(p.length<2){status.textContent='請貼上完整的 GitHub 專案或技能資料夾連結。';return}
const owner=p[0],repo=p[1],base='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),headers={Accept:'application/vnd.github+json'};
let branch='',path='';if(p[2]==='tree'||p[2]==='blob'){branch=p[3]||'';path=p.slice(4).join('/')}
status.textContent='正在搜尋此儲存庫的 SKILL.md…';button.disabled=true;
try{
const mr=await fetch(base,{headers});if(!mr.ok)throw Error(mr.status===404?'找不到公開儲存庫。':'GitHub 回應 '+mr.status);
const meta=await mr.json();branch=branch||meta.default_branch;
let files=[];
if(path.toLowerCase().endsWith('skill.md')){files=[{path}]}else{
const tr=await fetch(base+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1',{headers});if(!tr.ok)throw Error('無法讀取檔案清單。');
const tree=await tr.json();files=tree.tree.filter(x=>x.type==='blob'&&x.path.toLowerCase().endsWith('skill.md'));
if(path)files=files.filter(x=>x.path===path||x.path.startsWith(path.replace(/\\/$/,'')+'/'));
}
if(!files.length){status.textContent='這個儲存庫或資料夾中沒有找到 SKILL.md。請確認貼的是公開技能資料夾或技能檔連結。';return}
files=files.slice(0,20);
const cards=await Promise.all(files.map(async f=>{const raw='https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/'+f.path;const rr=await fetch(raw);if(!rr.ok)return '';const md=await rr.text();const name=front(md,'name')||f.path.split('/').slice(-2,-1)[0]||repo,desc=front(md,'description');return '<article class="result"><span class="tag">'+esc(f.path)+'</span><h2>'+esc(name)+'</h2><h3>這個 Skill 的用途</h3><p>'+esc(desc||'文件沒有提供簡短用途說明，請展開技能內容查看。')+'</p><details><summary>查看 SKILL.md 內容</summary><div class="readme">'+esc(md.slice(0,16000))+'</div></details><p><a target="_blank" rel="noreferrer" href="https://github.com/'+owner+'/'+repo+'/blob/'+branch+'/'+f.path+'">在 GitHub 開啟此技能 ↗</a></p></article>'}));
out.innerHTML=cards.filter(Boolean).join('');status.textContent='找到 '+files.length+' 個 Skill。';if(!out.innerHTML)status.textContent='找到技能路徑，但無法讀取文件；請確認它是公開內容。';
}catch(err){status.textContent='查詢失敗：'+err.message+'。請確認連結指向公開儲存庫。'}finally{button.disabled=false}
}
button.type='button';button.addEventListener('click',search);form.addEventListener('submit',function(e){e.preventDefault();search()});
</script></body></html>
