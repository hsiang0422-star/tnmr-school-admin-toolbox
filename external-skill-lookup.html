<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外部 GitHub Skill 查詢｜南特行政工具箱</title>
<style>:root{--ink:#213a39;--muted:#617775;--paper:#fffefa;--line:#dce7e2;--green:#176b5c;--pale:#e3f2ec}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:"Microsoft JhengHei",sans-serif;line-height:1.65}.shell{max-width:900px;margin:auto;padding:24px 16px}.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,34px);box-shadow:0 12px 36px #244b4210}.eyebrow{color:var(--green);font-weight:800;font-size:13px}.links{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.links a,.go{padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:white;color:var(--green);font-weight:750;text-decoration:none}.form{display:flex;gap:9px;flex-wrap:wrap}.form input{flex:1;min-width:240px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.go{background:var(--green);color:white;cursor:pointer;font:inherit}.status{margin:12px 0;color:var(--muted);font-size:14px}.result{margin-top:18px;padding:18px;background:white;border:1px solid var(--line);border-radius:14px}.result h2{margin-top:0}.copy-explanation{margin:8px 0 12px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--green);font:inherit;font-weight:750;cursor:pointer}.copy-explanation:hover{background:var(--pale)}.result p{white-space:pre-wrap}.tag{display:inline-block;background:var(--pale);padding:3px 9px;border-radius:20px;margin:2px;font-size:12px}.readme{max-height:420px;overflow:auto;white-space:pre-wrap;background:#f6f8f6;padding:14px;border-radius:10px;font-size:13px}footer{text-align:center;color:var(--muted);font-size:12px;margin:18px}</style>
</head><body><main class="shell"><section class="box"><span class="eyebrow">南特行政工具箱｜外部技能探索</span><h1>查詢網路上找到的 GitHub Skill</h1><p>貼上外部 GitHub 專案、資料夾或 SKILL.md 連結。頁面會搜尋專案中的 SKILL.md，整理技能名稱、用途說明與原始文件，協助判斷這個 Skill 是做什麼的。</p><nav class="links"><a href="./">返回行政工具箱</a><a href="github-skills.html">搜尋我的 Skill 庫</a></nav><form class="form" id="form"><input id="url" type="url" required placeholder="https://github.com/owner/repo/tree/main/path-to-skill"><button class="go" type="button" id="searchSkill" onclick="searchExternalSkill()">查詢外部 Skill</button></form><div class="status" id="status" role="status">支援公開 GitHub 專案或 SKILL.md 連結。</div><div id="results"></div></section><footer>讀取公開 GitHub 內容；英文用途說明會嘗試翻譯為繁體中文。翻譯服務不可用時顯示原文。頁面不會安裝或執行 Skill。</footer></main>
<script>
async function copyExplanation(button){
 var card=button.closest('.result'),text=button.getAttribute('data-copy-text')||'';if(!text){var description=button.previousElementSibling;text=description?description.innerText.trim():'';}
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{throw Error('clipboard unavailable');}}
 catch(e){var area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();var copied=document.execCommand('copy');area.remove();if(!copied){document.getElementById('status').textContent='無法自動複製，請手動選取說明文字。';return;}}
 var old=button.textContent;button.textContent='已複製，可貼到 Google 翻譯';button.disabled=true;setTimeout(function(){button.textContent=old;button.disabled=false;},2200);
}
async function searchExternalSkill(){
 var input=document.getElementById('url'),status=document.getElementById('status'),out=document.getElementById('results'),button=document.getElementById('searchSkill');
 status.textContent='正在查詢…';out.innerHTML='';button.disabled=true;
 try{
  var u=new URL(input.value.trim());if(u.hostname!=='github.com')throw Error('請貼上 github.com 的公開網址。');
  var p=u.pathname.split('/').filter(Boolean);if(p.length<2)throw Error('網址需包含擁有者和儲存庫名稱。');
  var owner=p[0],repo=p[1],branch='',path='';if(p[2]==='tree'||p[2]==='blob'){branch=p[3]||'';path=p.slice(4).join('/');}
  var api='https://api.github.com/repos/'+encodeURIComponent(owner)+'/'+encodeURIComponent(repo),mr=await fetch(api);if(!mr.ok)throw Error(mr.status===404?'找不到公開儲存庫。':'GitHub API 回應 '+mr.status);
  var meta=await mr.json();branch=branch||meta.default_branch;
  async function translateZh(text){if(!text||/[\u3400-\u9fff]/.test(text))return text;try{var chunks=[];for(var i=0;i<text.length;i+=350)chunks.push(text.slice(i,i+350));var translated=[];for(var chunk of chunks){var params=new URLSearchParams({q:chunk,langpair:'en|zh-TW'});var res=await fetch('https://api.mymemory.translated.net/get?'+params.toString());if(!res.ok)throw Error('translation unavailable');var data=await res.json();if(Number(data.responseStatus)!==200)throw Error('translation unavailable');translated.push(data.responseData.translatedText);}return translated.join('');}catch(e){return text;}}
  if(!path){
   var readme='',readmeName='README.md';
   for(var candidate of ['README.md','readme.md','README.MD']){var readmeResponse=await fetch('https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/'+candidate);if(readmeResponse.ok){readme=await readmeResponse.text();readmeName=candidate;break;}}
   if(!readme)throw Error('找不到這個專案的 README.md，無法根據專案說明整理內容。');
   var readmePlain=readme.replace(/```[\s\S]*?```/g,' ').replace(/!\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/^\s*[-*_]{3,}\s*$/gm,' ').replace(/^\s{0,3}#{1,6}\s*/gm,'').replace(/<[^>]+>/g,' ').replace(/[\t ]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
   var readmeExcerpt=readmePlain.slice(0,3500),translatedReadme=await translateZh(readmeExcerpt);
   var esc=function(v){return String(v||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});};
   out.innerHTML='<article class="result"><span class="tag">GitHub 開源專案 · 內容取自 '+esc(readmeName)+'</span><h2>'+esc(meta.full_name)+'</h2><h3>README 專案說明（繁體中文）</h3><p>'+esc(translatedReadme)+'</p><button type="button" class="copy-explanation" onclick="copyExplanation(this)">一鍵複製說明</button><p><b>主要語言：</b>'+esc(meta.language||'未標示')+'　<b>星標：</b>'+meta.stargazers_count+'</p><details><summary>查看 README 原文</summary><div class="readme">'+esc(readme.slice(0,12000))+'</div></details><p><a target="_blank" rel="noreferrer" href="'+esc(meta.html_url)+'">開啟 GitHub 專案 ↗</a>　<a target="_blank" rel="noreferrer" href="'+esc(meta.html_url+'/blob/'+branch+'/'+readmeName)+'">在 GitHub 查看 '+esc(readmeName)+' ↗</a></p></article>';
   status.textContent='已根據 README 整理專案說明。';return;
  }
  var files=[];
  if(path.toLowerCase().endsWith('skill.md'))files=[{path:path}];
  else{var tr=await fetch(api+'/git/trees/'+encodeURIComponent(branch)+'?recursive=1');if(!tr.ok)throw Error('無法讀取儲存庫檔案清單。');var tree=await tr.json();files=tree.tree.filter(function(x){return x.type==='blob'&&x.path.toLowerCase().endsWith('skill.md');});if(path){var prefix=path.endsWith('/')?path.slice(0,-1):path;files=files.filter(function(x){return x.path===prefix||x.path.indexOf(prefix+'/')===0;});}}
  if(!files.length)throw Error('這個連結範圍找不到 SKILL.md，請貼技能資料夾或 SKILL.md 網址。');
  var esc2=function(v){return String(v||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});};
  var cards=await Promise.all(files.slice(0,15).map(async function(f){var rr=await fetch('https://raw.githubusercontent.com/'+owner+'/'+repo+'/'+branch+'/'+f.path);if(!rr.ok)return '';var md=await rr.text(),name=f.path.split('/').slice(-2,-1)[0]||repo,desc='',inFront=false,descBlock=false,descLines=[];md.split(String.fromCharCode(10)).forEach(function(line){if(line.trim()==='---'){if(!inFront)inFront=true;else inFront=false;return;}if(!inFront)return;if(line.indexOf('name:')===0)name=line.slice(5).trim().replace(/^['\"]|['\"]$/g,'');if(line.indexOf('description:')===0){descBlock=line.trim().endsWith('>')||line.trim().endsWith('|');desc=line.slice(12).trim();if(!descBlock)desc=desc.replace(/^['\"]|['\"]$/g,'');return;}if(descBlock&&(line.startsWith(' ')||line.startsWith(String.fromCharCode(9))))descLines.push(line.trim());});if(descBlock)desc=descLines.join(' ');desc=await translateZh(desc);var translatedMd=await translateZh(md.slice(0,12000));var safe=translatedMd.replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];});return '<article class="result"><span class="tag">'+esc2(f.path)+'</span><h2>'+esc2(name)+'</h2><h3>這個 Skill 的用途</h3><p>'+esc2(desc||'文件沒有提供簡短用途說明，請展開技能內容查看。')+'</p><button type="button" class="copy-explanation" onclick="copyExplanation(this)">一鍵複製說明</button><details><summary>查看 SKILL.md 中文翻譯（機器翻譯）</summary><div class="readme">'+safe+'</div></details><details><summary>查看 SKILL.md 原文</summary><div class="readme">'+md.slice(0,12000).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];})+'</div></details><p><a target="_blank" rel="noreferrer" href="https://github.com/'+owner+'/'+repo+'/blob/'+branch+'/'+f.path+'">在 GitHub 開啟 ↗</a></p></article>'; }));
  out.innerHTML=cards.join('');status.textContent='查詢完成，找到 '+files.length+' 個 Skill。';
 }catch(e){status.textContent='查詢失敗：'+e.message;}finally{button.disabled=false;}
}
</script></body></html>
