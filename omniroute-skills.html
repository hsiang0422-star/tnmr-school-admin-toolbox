niRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-inference", "time": "2026-11-08 07:13"}, {"name": "omni-mcp", "desc": "連接 OmniRoute MCP 伺服器（110 項工具，支援 SSE、stdio 與 HTTP）（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-mcp", "time": "2026-11-08 07:13"}, {"name": "omni-models", "desc": "查詢所有已設定服務商的可用模型、解析模型別名（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-models", "time": "2026-11-08 07:13"}, {"name": "omni-providers", "desc": "透過 REST API 管理服務商連線、API 金鑰、OAuth 流程與連線測試（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-providers", "time": "2026-11-08 07:13"}, {"name": "omni-proxies", "desc": "為上游服務商請求設定 HTTP、HTTPS 或 SOCKS 代理與輪替規則（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-proxies", "time": "2026-11-08 07:13"}, {"name": "omni-resilience", "desc": "監控服務商健康、斷路器狀態、延遲指標與預算警示（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-resilience", "time": "2026-11-08 07:13"}, {"name": "omni-settings", "desc": "讀取與更新全域設定，如系統提示詞、思考預算、IP 過濾與登入要求（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-settings", "time": "2026-11-08 07:13"}, {"name": "omni-sync-cloud", "desc": "把設定與服務商連線同步到雲端儲存，或從雲端還原（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-sync-cloud", "time": "2026-11-08 07:13"}, {"name": "omni-tunnels", "desc": "建立安全通道（ngrok、Cloudflare 等），讓 OmniRoute 可被外部或遠端代理存取（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-tunnels", "time": "2026-11-08 07:13"}, {"name": "omni-usage-logs", "desc": "查看詳細呼叫紀錄與用量分析，依服務商、模型、時間與費用篩選並匯出（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-usage-logs", "time": "2026-11-08 07:13"}, {"name": "omni-version-manager", "desc": "安裝、啟動、停止與更新內嵌服務（9Router、CLIProxyAPI）並查看狀態與日誌（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-version-manager", "time": "2026-11-08 07:13"}, {"name": "omni-webhooks", "desc": "註冊、測試與移除 Webhook，訂閱請求完成、失敗與配額超限等事件（原作者 diegosouzapw/OmniRoute，MIT 授權；需先安裝並啟動 OmniRoute 伺服器）。", "url": "https://github.com/hsiang0422-star/claude-skills/tree/main/omni-webhooks", "time": "2026-11-08 07:13"}];
const grid=document.getElementById('grid');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(list){
  grid.innerHTML=list.map(x=>'<article class="card"><h2>'+esc(x.name)+'</h2><p>'+esc(x.desc)+'</p><div class="meta">新增於 '+esc(x.time)+'</div><div class="row"><button type="button" data-copy="'+esc(x.name)+'">複製名稱</button><a class="src" href="'+esc(x.url)+'" target="_blank" rel="noreferrer">查看來源 ↗</a></div></article>').join('');
  document.getElementById('count').textContent=list.length+' 項';
  document.getElementById('empty').style.display=list.length?'none':'block';
}
document.getElementById('search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  render(omni.filter(x=>!q||(x.name+' '+x.desc).toLowerCase().includes(q)));
});
grid.addEventListener('click',e=>{
  const b=e.target.closest('[data-copy]'); if(!b) return;
  navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);
  b.textContent='已複製'; setTimeout(()=>b.textContent='複製名稱',1200);
});
render(omni);
</script>
