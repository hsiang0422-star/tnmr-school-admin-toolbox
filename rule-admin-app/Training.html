<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#203936;background:#f3f7f3;--green:#176b5c;--line:#d9e5df;--muted:#647873}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:25px auto;padding:0 15px 40px}.hero,.panel,.record{background:#fffefa;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px #244b4210}.hero,.panel{padding:clamp(17px,3vw,28px);margin-bottom:15px}.eyebrow{font-size:13px;color:var(--green);font-weight:800}.hero h1{font-size:clamp(26px,4vw,38px);margin:4px 0}.hero p,.hint{color:var(--muted);margin:4px 0}.layout{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.3fr);gap:15px;align-items:start}.panel h2{font-size:20px;margin:0 0 12px}label{display:grid;gap:5px;font-size:13px;font-weight:750;margin:10px 0}input,textarea{width:100%;padding:10px 11px;border:1px solid #c9d9d2;border-radius:9px;font:inherit;color:#203936;background:#fff}textarea{min-height:112px;line-height:1.6;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;background:var(--green);color:#fff;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}button.secondary{background:#edf5f0;color:var(--green);border:1px solid var(--line)}button:disabled{opacity:.55}.status{min-height:1.5em;color:var(--green);font-size:13px;font-weight:700}.toolbar{display:flex;gap:10px;margin:8px 0 13px}.toolbar input{flex:1}.records{display:grid;gap:10px}.record{padding:15px}.record h3{margin:0 0 4px;font-size:18px}.meta{font-size:12px;color:var(--muted)}.notes{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.tags{font-size:12px;color:#176b5c}.links{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.links a{color:#176b5c}.empty{padding:28px;text-align:center;color:var(--muted)}.secure{padding:11px 13px;background:#eaf4ef;border-radius:10px;color:#35554f;font-size:13px;margin-top:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}.toolbar{flex-direction:column}}
</style></head><body><main>
<header class="hero"><div class="eyebrow">南特行政工具箱｜研習紀錄管理</div><h1>研習資料管理</h1><p>管理研習資訊、公開摘要、私人筆記及附件；可指定哪些資訊出現在公開查詢頁。</p><div class="secure">🔐 管理頁限定 yenju94 Google 帳號登入。公開查詢頁只顯示你勾選公開的欄位；私人筆記與附件不會列入公開頁。</div></header>
<div class="layout"><section class="panel"><h2 id="formTitle">新增研習資料</h2><form id="form">
<input id="id" type="hidden"><label>研習名稱<input id="title" required maxlength="300" placeholder="例如：甲種職業安全衛生業務主管訓練"></label>
<div class="twocol"><label>類別<input id="category" maxlength="100" placeholder="研習、研討會、說明會"></label><label>主辦單位<input id="organizer" maxlength="300"></label></div>
<div class="twocol"><label>日期／期間<input id="date" maxlength="100" placeholder="例如：115年12月26日－116年1月16日"></label><label>地點<input id="place" maxlength="300"></label></div>
<div class="twocol"><label>時數<input id="hours" maxlength="100"></label><label>費用<input id="fee" maxlength="100"></label></div>
<label>公開資料連結<input id="link" type="url" maxlength="2000" placeholder="https://"><span class="hint">若勾選公開，請確認連結本身可對外閱覽。</span></label>
<label>標籤<input id="tags" maxlength="500" placeholder="例如：職安、假日班、總務"></label>
<label style="display:flex;align-items:center;gap:9px"><input id="publish" type="checkbox" style="width:auto">列入公開查詢</label>
<label>公開摘要<textarea id="summary" maxlength="6000" placeholder="此欄僅在勾選公開後顯示，勿放個資或私人聯絡資訊"></textarea></label>
<label>私人筆記<textarea id="notes" maxlength="12000" placeholder="私人備忘、心得、聯絡事項及後續待辦；只在管理頁可見"></textarea></label>
<label>私人附件<input id="files" type="file" multiple><span class="hint">最多 5 個，每個小於 5 MB；檔案存入私人 Drive，公開頁不顯示附件。</span></label>
<div class="buttons"><button id="save" type="submit">儲存研習資料</button><button class="secondary" type="button" id="reset">清空表單</button></div><p class="status" id="formStatus" role="status"></p></form></section>
<section class="panel"><h2>查詢研習資料</h2><div class="toolbar"><input id="search" type="search" placeholder="搜尋名稱、主辦單位、日期、標籤或筆記"><button class="secondary" id="refresh" type="button">重新整理</button></div><p class="hint" id="count"></p><div class="records" id="records"><div class="empty">正在載入資料…</div></div></section></div>
</main><script>
const $=id=>document.getElementById(id),fieldIds=['title','category','organizer','date','place','hours','fee','link','tags','summary','notes'];let allRecords=[];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){ $('records').innerHTML='<div class="empty">正在載入資料…</div>';google.script.run.withSuccessHandler(rows=>{allRecords=rows||[];render()}).withFailureHandler(e=>{$('records').innerHTML='<div class="empty">'+esc(e.message||'讀取失敗')+'</div>'}).getTrainingRecords() }
function render(){const q=$('search').value.trim().toLowerCase();const rows=allRecords.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=`共 ${rows.length} 筆${q?'符合搜尋':''}`;if(!rows.length){$('records').innerHTML='<div class="empty">'+(q?'找不到符合的研習紀錄。':'尚無資料，請先新增一筆。')+'</div>';return}$('records').innerHTML=rows.map(r=>`<article class="record"><h3>${esc(r.title)}${r.publish?'　<span class="tags">公開</span>':''}</h3><div class="meta">${[r.date,r.organizer,r.place,r.hours&&r.hours+'小時',r.fee].filter(Boolean).map(esc).join(' · ')}</div>${r.category?`<div class="tags">${esc(r.category)}${r.tags?'　｜　'+esc(r.tags):''}</div>`:''}${r.summary?`<div class="notes"><strong>公開摘要：</strong>${esc(r.summary)}</div>`:''}<div class="notes"><strong>私人筆記：</strong>${esc(r.notes)}</div><div class="links">${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">開啟資料連結 ↗</a>`:''}${(r.attachments||[]).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name||'附件')} ↗</a>`).join('')}<button class="secondary" type="button" onclick="editRecord('${esc(r.id)}')">編輯</button></div></article>`).join('')}
window.editRecord=id=>{const r=allRecords.find(x=>x.id===id);if(!r)return;$('id').value=r.id;fieldIds.forEach(k=>$(k).value=r[k]||'');$('publish').checked=!!r.publish;$('formTitle').textContent='編輯研習資料';$('form').scrollIntoView({behavior:'smooth',block:'start'})};
$('form').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;$('formStatus').textContent='正在儲存…';try{const files=await Promise.all(Array.from($('files').files).map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,data:reader.result});reader.onerror=()=>reject(new Error('附件讀取失敗：'+file.name));reader.readAsDataURL(file)})));const data={id:$('id').value,files,publish:$('publish').checked};fieldIds.forEach(k=>data[k]=$(k).value);google.script.run.withSuccessHandler(()=>{$('formStatus').textContent='已儲存到雲端研習資料庫。';clearForm();load();$('save').disabled=false}).withFailureHandler(err=>{$('formStatus').textContent=err.message||'儲存失敗。';$('save').disabled=false}).saveTrainingRecord(data)}catch(err){$('formStatus').textContent=err.message;$('save').disabled=false}});
function clearForm(){$('form').reset();$('id').value='';$('formTitle').textContent='新增研習資料'}$('reset').onclick=()=>{clearForm();$('formStatus').textContent=''};$('refresh').onclick=load;$('search').addEventListener('input',render);load();
</script></body></html>
