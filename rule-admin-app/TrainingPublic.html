<!doctype html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#203936;background:#f3f7f3;--green:#176b5c;--line:#d9e5df;--muted:#647873}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:25px auto;padding:0 15px 40px}.hero,.record{background:#fffefa;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px #244b4210}.hero{padding:clamp(18px,4vw,34px);margin-bottom:16px}.eyebrow{font-size:13px;color:var(--green);font-weight:800}.hero h1{font-size:clamp(26px,4vw,38px);margin:4px 0}.hero p,.hint{color:var(--muted);margin:4px 0}.toolbar{display:flex;gap:10px;margin:14px 0}.toolbar input{flex:1}input{width:100%;padding:11px 12px;border:1px solid #c9d9d2;border-radius:10px;font:inherit;background:white}.records{display:grid;gap:11px}.record{padding:17px}.record h2{font-size:19px;margin:0 0 5px}.meta{font-size:13px;color:var(--muted)}.summary{white-space:pre-wrap;overflow-wrap:anywhere;margin:11px 0}.tags{font-size:12px;color:var(--green)}.record a{color:var(--green);font-weight:700;font-size:13px}.empty{text-align:center;padding:35px;color:var(--muted)}.count{font-size:13px;color:var(--muted)}@media(max-width:620px){.toolbar{flex-direction:column}}
</style></head><body><main><header class="hero"><div class="eyebrow">南特行政工具箱｜公開查詢</div><h1>研習資料庫</h1><p>此頁只顯示管理者選擇公開的研習資訊與摘要。私人筆記及 Drive 附件不會出現在這裡。</p><div class="toolbar"><input id="search" type="search" placeholder="搜尋研習名稱、類別、日期、主辦單位或摘要"></div><p class="count" id="count"></p></header><section class="records" id="records"><div class="empty">正在載入公開研習資料…</div></section></main><script>
const $=id=>document.getElementById(id);let rows=[];function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.trim().toLowerCase();const list=rows.filter(r=>Object.values(r).some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=`共 ${list.length} 筆公開研習資料`;if(!list.length){$('records').innerHTML='<div class="empty">'+(q?'找不到符合的公開資料。':'目前尚無公開研習資料。')+'</div>';return}$('records').innerHTML=list.map(r=>`<article class="record"><h2>${esc(r.title)}</h2><div class="meta">${[r.date,r.organizer,r.place,r.hours&&r.hours+'小時',r.fee].filter(Boolean).map(esc).join(' · ')}</div>${r.category||r.tags?`<div class="tags">${[r.category,r.tags].filter(Boolean).map(esc).join('　｜　')}</div>`:''}${r.summary?`<div class="summary">${esc(r.summary)}</div>`:''}${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">開啟公開資料連結 ↗</a>`:''}</article>`).join('')}
google.script.run.withSuccessHandler(data=>{rows=data||[];render()}).withFailureHandler(()=>{$('records').innerHTML='<div class="empty">暫時無法載入公開資料，請稍後重試。</div>'}).getPublicTrainingRecords();$('search').addEventListener('input',render);
</script></body></html>
